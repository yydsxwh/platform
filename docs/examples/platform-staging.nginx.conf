# Owner 拍板：预发域名 api-staging.yydsxwh.com → 127.0.0.1:4000
# 本文件只是示例。不要自动装到生产机。DNS / TLS：NEEDS_OWNER_CONFIRMATION。

server {
  listen 443 ssl;
  server_name api-staging.yydsxwh.com;

  # ssl_certificate     /path/to/staging.fullchain.pem;
  # ssl_certificate_key /path/to/staging.privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://127.0.0.1:4000/health;
  }

  location /ready {
    proxy_pass http://127.0.0.1:4000/ready;
  }
}
